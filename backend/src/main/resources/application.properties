spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/spendly
spring.datasource.username=spendly
spring.datasource.password=${SPENDLY_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=none
# PostgreSQL constraint errors can contain email addresses; never log their details.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
